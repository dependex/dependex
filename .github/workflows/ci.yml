name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, json, mbstring

      - name: PHP Syntax Check
        run: |
          echo "🔍 Checking PHP syntax..."
          errors=0
          for file in $(find . -name "*.php" -not -path "./.git/*"); do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "❌ Syntax error in: $file"
              php -l "$file"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "❌ Found $errors file(s) with syntax errors"
            exit 1
          fi
          echo "✅ All PHP files pass syntax check"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets
        run: |
          echo "🔒 Scanning for potential secrets..."
          if grep -rn "password\s*=" --include="*.php" --include="*.js" . | grep -v ".example" | grep -v "PASSWORD" | grep -v "password_hash" | grep -v "password_verify" | grep -v "\$_POST" | grep -v "\$_REQUEST" | head -5; then
            echo "⚠️ Review the above lines for hardcoded credentials"
          fi
          
          if [ -f "apikeysAI.env" ]; then
            echo "❌ apikeysAI.env should NOT be in the repository!"
            exit 1
          fi
          
          echo "✅ No critical secrets detected"

      - name: Check .gitignore
        run: |
          echo "📋 Verifying .gitignore..."
          for pattern in "*.env" "apikeysAI.env" ".env" "*.log"; do
            if grep -q "$pattern" .gitignore; then
              echo "✅ $pattern is excluded"
            else
              echo "❌ $pattern is NOT in .gitignore!"
              exit 1
            fi
          done
