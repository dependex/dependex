name: Universal Email OS Self-Optimizer Engine

on:
  schedule:
    - cron: '0 6 * * 1' # Ogni lunedì mattina alle 06:00 UTC
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Optimization Recommendations
        run: |
          python -c "
          from src.optimizer.pr_generator import OptimizationEngine
          from src.reporting.kpi import KPIReporter
          import json, os
          
          reporter = KPIReporter()
          optimizer = OptimizationEngine()
          kpi = reporter.compute_daily_kpi(200, 196, 32, 4, 1, 2, 0, 97.0)
          recs = optimizer.generate_recommendations(kpi)
          proposal = optimizer.format_pull_request_proposal(recs)
          
          os.makedirs('reports', exist_ok=True)
          with open('reports/optimization_proposal.md', 'w', encoding='utf-8') as f:
              f.write(proposal)
          print('Proposte di ottimizzazione generate con successo.')
          "
