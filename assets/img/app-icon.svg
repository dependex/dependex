<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DEPENDEX App Icon">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B33"/>
      <stop offset="100%" stop-color="#0C294D"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="50%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Ring of Listening -->
  <circle cx="256" cy="235" r="170" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="4"/>
  <circle cx="256" cy="235" r="140" fill="none" stroke="rgba(249,115,22,0.12)" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- Main Intersecting Vitality Arcs (Club & Listening Metaphor) -->
  <!-- Green Arc (Life, Health, Growth, Sobriety) -->
  <path d="M 150,290 C 120,210 150,140 220,110 C 290,80 370,120 380,190 C 390,260 320,330 256,330 C 200,330 170,290 150,290 Z" 
        fill="none" stroke="url(#greenGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>

  <!-- Orange Arc (Warmth, Relationship, Dialogue, Sun) -->
  <path d="M 362,180 C 392,260 362,330 292,360 C 222,390 142,350 132,280 C 122,210 192,140 256,140 C 312,140 342,180 362,180 Z" 
        fill="none" stroke="url(#orangeGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- Central Nexus Core (The Person & The Meeting) -->
  <circle cx="256" cy="235" r="28" fill="url(#sunGlow)"/>
  <circle cx="256" cy="235" r="14" fill="#FFFFFF"/>

  <!-- Wordmark Bottom -->
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="6" fill="#FFFFFF">DEPENDEX</text>
  <text x="256" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="16" font-weight="800" letter-spacing="4" fill="#F97316">AL CLUB. COL CLUB.</text>
</svg>
