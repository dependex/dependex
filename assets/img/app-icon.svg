<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DEPENDEX - Oro su Fondo Nero">
  <defs>
    <!-- Jet Black Ultra Dark Surface -->
    <linearGradient id="blackBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="40%" stop-color="#0a0b0f"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- 24K Luxury Metallic Gold Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#AA7A1E"/>
      <stop offset="75%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#8C6514"/>
    </linearGradient>

    <!-- Gold Specular Sheen Gradient -->
    <linearGradient id="goldSheen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#996515"/>
      <stop offset="35%" stop-color="#E5C158"/>
      <stop offset="65%" stop-color="#FFF8D6"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <!-- Subtle Radial Gold Glow Filter -->
    <radialGradient id="centerAura" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="metallicBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Solid Deep Jet-Black Background -->
  <rect width="512" height="512" rx="128" fill="url(#blackBase)"/>
  
  <!-- Subtle Outer Metallic Gold Border -->
  <rect x="6" y="6" width="500" height="500" rx="122" fill="none" stroke="url(#goldMetallic)" stroke-width="2.5" opacity="0.6"/>

  <!-- Radial Gold Atmosphere -->
  <circle cx="256" cy="225" r="180" fill="url(#centerAura)"/>

  <!-- Geometric Concentric Rings of Trust & Sovereignty -->
  <circle cx="256" cy="225" r="145" fill="none" stroke="url(#goldMetallic)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>
  <circle cx="256" cy="225" r="165" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>

  <!-- Primary Metallic Gold Intersecting Arcs (Hudolin Ecological-Social Circle) -->
  <path d="M 148,270 C 118,195 150,130 220,105 C 285,80 365,115 378,182 C 390,250 325,315 256,315 C 205,315 170,278 148,270 Z" 
        fill="none" stroke="url(#goldMetallic)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#metallicBloom)"/>

  <path d="M 364,178 C 394,250 362,315 295,342 C 228,368 148,332 135,268 C 122,200 188,135 256,135 C 308,135 342,172 364,178 Z" 
        fill="none" stroke="url(#goldSheen)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Central Diamond / Core Nexus: Dignity & Lucid Mind -->
  <polygon points="256,195 285,225 256,255 227,225" fill="url(#goldMetallic)"/>
  <polygon points="256,207 274,225 256,243 238,225" fill="#FFFFFF"/>
  <circle cx="256" cy="225" r="4" fill="#050507"/>

  <!-- Sleek Luxury Typography (Pure Gold & White on Black) -->
  <text x="256" y="435" text-anchor="middle" font-family="'Playfair Display', -apple-system, 'Inter', serif" font-size="44" font-weight="900" letter-spacing="8" fill="url(#goldMetallic)">DEPENDEX</text>
  <text x="256" y="468" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="5" fill="#FFFFFF" opacity="0.85">AL CLUB. COL CLUB.</text>
</svg>
