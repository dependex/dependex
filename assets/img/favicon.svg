        fill="none" stroke="url(#favGreen)" stroke-width="6.5" stroke-linecap="round"/>

  <path d="M 44,26 C 49,36 44,46 34,49 C 24,52 14,46 13,37 C 12,28 21,19 32,19 C 39,19 42,24 44,26 Z" 
        fill="none" stroke="url(#favOrange)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Core Spark -->
