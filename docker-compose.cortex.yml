version: '3.8'

services:
  cortex:
    build:
      context: ./cortex
      dockerfile: Dockerfile.cortex
    container_name: cortex-brain
    ports:
      - "8081:8081"
    volumes:
      - ./cortex/memory:/app/memory
      - ./data:/app/data
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - CORTEX_LLM_MODEL=llama3.1:8b
      - CORTEX_PORT=8081
    restart: unless-stopped
    networks:
      - dependex-network

  ollama:
    image: ollama/ollama:latest
    container_name: cortex-llm
    ports:
      - "11434:11434"
    volumes:
      - ./cortex/ollama-models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped
    networks:
      - dependex-network

networks:
  dependex-network:
    driver: bridge
