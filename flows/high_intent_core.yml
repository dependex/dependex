flow_id: high_intent_core
version: "1.0.0"
name: "Conversione Protocollo Completo (High Intent Core)"
description: "Sequenza a 7 step ad alta conversione per il passaggio da Starter Kit al Protocollo Completo dei 5 Passi"
trigger:
  type: event
  event_name: "high_intent_detected"
  filter:
    score_gte: 8
exit_conditions:
  - event_name: "purchase_core_completed"
    action: "stop_flow"
  - event_name: "unsubscribed"
    action: "stop_flow"
steps:
  - step_id: "core_step_01"
    type: "send_email"
    template_id: "core_01_insight"
    subject: "I primi 7 giorni sono superati: ora serve la struttura che regge 6 mesi"
  - step_id: "delay_01"
    type: "delay"
    delay_duration: "48h"
  - step_id: "core_step_02"
    type: "send_email"
    template_id: "core_02_proof"
    subject: "Cosa accade quando la famiglia entra nel cerchio: dati e percorsi reali"
  - step_id: "delay_02"
    type: "delay"
    delay_duration: "48h"
  - step_id: "core_step_03"
    type: "send_email"
    template_id: "core_03_mechanism"
    subject: "Lo Schema Logico dei 5 Passi spiegato nel dettaglio operativo"
  - step_id: "delay_03"
    type: "delay"
    delay_duration: "48h"
  - step_id: "core_step_04"
    type: "send_email"
    template_id: "core_04_offer_stack"
    subject: "Protocollo Completo: Piattaforma, Academy e Sessioni di Revisione"
  - step_id: "delay_04"
    type: "delay"
    delay_duration: "48h"
  - step_id: "core_step_05"
    type: "send_email"
    template_id: "core_05_obiezioni"
    subject: "'Lui/lei non verrà mai': come disinnescare l'attrito a casa"
  - step_id: "delay_05"
    type: "delay"
    delay_duration: "48h"
  - step_id: "core_step_06"
    type: "send_email"
    template_id: "core_06_garanzia"
    subject: "Garanzia 'Trasformazione o Rimborso Integrale' 60 Giorni + 1h Consulenza"
  - step_id: "delay_06"
    type: "delay"
    delay_duration: "72h"
  - step_id: "core_step_07"
    type: "send_email"
    template_id: "core_07_chiusura"
    subject: "Iniziamo i 5 passi. Insieme alla tua famiglia."
