flow_id: welcome_onboarding
version: "2.0.0"
name: "Accoglienza & Onboarding Dependex Club (12 Step)"
description: "Protocollo di accoglienza a 12 step: Consegna magnete -> Quick win -> Problema -> Opportunità -> Storia -> Errore -> Prova -> Obiezioni -> Ponte -> Stack -> Decisione -> Next-best-action"
trigger:
  type: event
  event_name: "lead_created"
  filter:
    consent: true
exit_conditions:
  - event_name: "purchase_completed"
    action: "stop_flow"
  - event_name: "unsubscribed"
    action: "stop_flow"
steps:
  - step_id: "welcome_step_01"
    type: "send_email"
    template_id: "welcome_01_consegna"
    subject: "La tua Cassetta Attrezzi Primo Giorno (e la sedia più vicina a te)"
  - step_id: "delay_01"
    type: "delay"
    delay_duration: "24h"
  - step_id: "welcome_step_02"
    type: "send_email"
    template_id: "welcome_02_quickwin"
    subject: "Il Club più vicino a te (con giorno e orario verificato)"
  - step_id: "delay_02"
    type: "delay"
    delay_duration: "48h"
  - step_id: "welcome_step_03"
    type: "send_email"
    template_id: "welcome_03_problema"
    subject: "La scusa del 'controllo io' (perché la sola forza di volontà perde)"
  - step_id: "delay_03"
    type: "delay"
    delay_duration: "48h"
  - step_id: "welcome_step_04"
    type: "send_email"
    template_id: "welcome_04_opportunita"
    subject: "Cosa cambia dal primo giorno: lo Schema Logico dei 5 Passi"
  - step_id: "delay_04"
    type: "delay"
    delay_duration: "48h"
  - step_id: "welcome_step_05"
    type: "send_email"
    template_id: "welcome_05_storia"
    subject: "Vladimir Hudolin non ha mai parlato di 'malati': 40 anni di cerchi solidali"
  - step_id: "delay_05"
    type: "delay"
    delay_duration: "48h"
  - step_id: "welcome_step_06"
    type: "send_email"
    template_id: "welcome_06_errore"
    subject: "L'errore comune che fa ricadere a settimana 3 (e come evitarlo)"
  - step_id: "delay_06"
    type: "delay"
    delay_duration: "48h"
  - step_id: "welcome_step_07"
    type: "send_email"
    template_id: "welcome_07_prova"
    subject: "I numeri veri della rete: 361 Club in Italia verificati uno per uno"
  - step_id: "delay_07"
    type: "delay"
    delay_duration: "48h"
  - step_id: "welcome_step_08"
    type: "send_email"
    template_id: "welcome_08_obiezioni"
    subject: "'Non ho tempo' e le altre 3 obiezioni: risposte oneste e concrete"
  - step_id: "delay_08"
    type: "delay"
    delay_duration: "48h"
  - step_id: "welcome_step_09"
    type: "send_email"
    template_id: "welcome_09_ponte"
    subject: "Dalla Cassetta Attrezzi al primo passo: Starter Kit & Diagnosi"
  - step_id: "delay_09"
    type: "delay"
    delay_duration: "48h"
  - step_id: "welcome_step_10"
    type: "send_email"
    template_id: "welcome_10_stack"
    subject: "Cosa c'è dentro i 27 €: Starter Kit voce per voce e Garanzia 30 Giorni"
  - step_id: "delay_10"
    type: "delay"
    delay_duration: "72h"
  - step_id: "welcome_step_11"
    type: "send_email"
    template_id: "welcome_11_decisione"
    subject: "Una decisione netta da 27 €: nessun rischio, zero alibi"
  - step_id: "delay_11"
    type: "delay"
    delay_duration: "240h"
  - step_id: "welcome_step_12"
    type: "send_email"
    template_id: "welcome_12_nextaction"
    subject: "Restiamo in contatto a modo tuo: imposta le tue preferenze"
